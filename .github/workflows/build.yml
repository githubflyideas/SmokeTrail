name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...

  # The point of ADR 1: every target below is one `go build` with no toolchain to
  # install. If this job ever needs a matrix of containers, the SQLite driver
  # decision has been undone.
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, name: SmokeTrail-windows-amd64.exe }
          - { goos: windows, goarch: '386', name: SmokeTrail-windows-386.exe }
          - { goos: windows, goarch: arm64, name: SmokeTrail-windows-arm64.exe }
          - { goos: linux,   goarch: amd64, name: smoketrail-linux-amd64 }
          - { goos: linux,   goarch: arm64, name: smoketrail-linux-arm64 }
          - { goos: darwin,  goarch: arm64, name: smoketrail-darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go mod tidy
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" \
            -o "dist/${{ matrix.name }}" .
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: smoketrail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # The M0 gate, run on the platform it was written for. This is the job whose
  # output decides whether the RTT-distribution premise holds on Windows.
  selftest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go mod tidy
      - run: go test ./...
      - run: go run . selftest
