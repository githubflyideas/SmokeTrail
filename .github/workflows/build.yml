name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...

      # go.sum is not committed yet, so every run above re-resolves the module
      # graph from the network and a new release of any transitive dependency can
      # turn this red with no commit behind it. Publishing the resolved go.sum as
      # an artifact is how it gets committed: download it, add it, and the two
      # `go mod tidy` lines in this file become `go mod download`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-sum
          path: go.sum
          if-no-files-found: warn

  # The point of ADR 1: every target below is one `go build` with no toolchain to
  # install. If this job ever needs a matrix of containers, the SQLite driver
  # decision has been undone.
  cross:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first target to fail cancels the rest and the log shows
      # one red X with no way to tell whether one target broke or all six did.
      # windows/arm64 failed alone for two releases and looked like a total break.
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, name: pingping-windows-amd64.exe }
          - { goos: windows, goarch: '386', name: pingping-windows-386.exe }
          - { goos: windows, goarch: arm64, name: pingping-windows-arm64.exe }
          - { goos: linux,   goarch: amd64, name: pingping-linux-amd64 }
          - { goos: linux,   goarch: arm64, name: pingping-linux-arm64 }
          - { goos: darwin,  goarch: arm64, name: pingping-darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go mod tidy
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" \
            -o "dist/${{ matrix.name }}" .
          ls -la dist/

      # Run the artifact, do not merely produce it.
      #
      # `go build` succeeding proves the program compiles, and nothing else. A
      # binary can compile, link, start and serve its first page while being
      # incapable of storing a single measurement, because the SQLite driver is
      # chosen at build time and a wrong one fails only when something first
      # touches the database. On Windows that first touch is service
      # registration, where it surfaces as "the service could not be registered
      # (exit 1)" and never mentions a database.
      #
      # This job could only ever run one of the six, and one is enough: the
      # storage layer is the same pure-Go code on every target.
      - name: smoke-test the binary this job just built
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          bin="$PWD/dist/${{ matrix.name }}"
          chmod +x "$bin"
          work=$(mktemp -d); mkdir -p "$work/data"

          # selftest carries its own storage verdict; a FAIL there is this exact
          # class of fault and must stop the build.
          "$bin" selftest | tee "$work/selftest.txt"
          if grep -q "CANNOT STORE DATA" "$work/selftest.txt"; then
            echo "::error::the built binary cannot open a database"
            exit 1
          fi

          # End to end against the real HTTP API: first-run setup, sign in, add a
          # target, read it back. This is the path an operator takes in the first
          # sixty seconds, and it is the one that was broken while every build
          # was green.
          "$bin" --data "$work/data" --port 8599 --localhost &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "http://127.0.0.1:8599/login" && break
            sleep 0.25
          done

          curl -sf -X POST http://127.0.0.1:8599/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"User":"ci","Pass":"correct horse battery"}' > /dev/null
          curl -sf -c "$work/c" -X POST http://127.0.0.1:8599/api/login \
            -H 'Content-Type: application/json' \
            -d '{"User":"ci","Pass":"correct horse battery"}' > /dev/null
          curl -sf -b "$work/c" -X POST http://127.0.0.1:8599/api/targets \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke","type":"icmp","host":"127.0.0.1","pace":"fast"}' > /dev/null
          curl -sf -b "$work/c" http://127.0.0.1:8599/api/targets | tee "$work/targets.json"
          grep -q '"name":"smoke"' "$work/targets.json"

          # The database has to exist on disk afterwards. An in-memory fallback
          # would pass everything above and lose the data on restart.
          test -s "$work/data/pingping.db"
          echo "smoke test passed: the binary stores what it is told to store"

      - uses: actions/upload-artifact@v4
        with:
          name: pingping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # selftest measures the HOST, not the code: clock resolution, scheduler wake
  # latency, ticker drift. A GitHub runner is a shared VM, so a FAIL here says
  # something about Azure's scheduler that afternoon and nothing about this
  # commit — gating on it would be flaky by construction. So this job REPORTS.
  # The numbers go into the run summary where a human can read them, which is
  # the whole point: the question selftest answers is whether a given machine
  # can resolve the RTT differences this project draws, and that question is
  # asked again on every machine the binary lands on.
  selftest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go mod tidy
      - run: go test ./...
      - name: selftest (reported, not gated)
        shell: bash
        run: |
          {
            echo '### `selftest` on `windows-latest`'
            echo
            echo 'Shared CI VM — read this as one data point, not as a verdict on the commit.'
            echo
            echo '```'
            go run . selftest 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
