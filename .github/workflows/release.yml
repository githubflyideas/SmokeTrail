name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }

      # One step, one output. Two conditional steps writing the same output name
      # meant a manual run produced an empty version and named every artefact
      # "SmokeTrail--setup.exe".
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          [ -n "$v" ] || { echo "no version could be determined"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

      # go.sum is not committed until the first `go mod tidy` runs somewhere with
      # a reachable module proxy; do it here so a fresh clone still releases.
      - run: go mod tidy && go build ./... && go test ./...

      # One `go build` per target, no toolchain, no container. If this ever needs
      # more than this, ADR 1 has been undone.
      # Pinned, not @latest: this step decides what the version resource of every
      # shipped .exe says, and a release should not change because an upstream
      # tool did. gen-resource.sh writes one object per architecture — see the
      # header in that script for why a single .syso cannot work.
      - name: stamp the Windows resources (version, icon, manifest)
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1
          PATH="$(go env GOPATH)/bin:$PATH" packaging/gen-resource.sh "${{ steps.v.outputs.version }}"
          git diff --stat -- 'resource_windows_*.syso' || true

      - name: cross-build
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          for t in windows/amd64 windows/386 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            # Windows binaries are PascalCase, matching the product name shown in
            # Services.msc, Task Manager and the file's own version resource.
            name="smoketrail-${os}-${arch}"
            [ "$os" = windows ] && name="SmokeTrail-${os}-${arch}.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=v${V}" -o "dist/${name}" .
          done
          ls -la dist/

      # The portable zip carries an empty-but-present data/ folder. That single
      # directory is the entire portable-vs-installed switch (ADR 5).
      - name: portable zip
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            d=$(mktemp -d)
            mkdir -p "$d/data"
            cp "dist/SmokeTrail-windows-${arch}.exe" "$d/SmokeTrail.exe"
            cp packaging/portable/README.txt "$d/data/README.txt"
            cp README.md LICENSE "$d/"
            (cd "$d" && zip -qr - .) > "dist/SmokeTrail-${V}-windows-${arch}-portable.zip"
          done
          ls -la dist/*.zip
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  # makensis runs on Linux, so the installer comes out of the same ubuntu job
  # family as the binaries — no Windows runner anywhere in the release path.
  installer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: build setup.exe
        run: |
          cp dist/SmokeTrail-windows-amd64.exe dist/SmokeTrail.exe
          cd packaging && makensis -DVERSION=${{ needs.build.outputs.version }} SmokeTrail.nsi
          ls -la ../dist/*setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: dist/*setup.exe }

  publish:
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: |
          mkdir -p out && find art -type f \( -name '*.exe' -o -name '*.zip' -o -name 'smoketrail-*' -o -name 'SmokeTrail-*' \) -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
