<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,"><title>Sign in — SmokeTrail</title>
<script src="/static/i18n.js"></script>
<script>
  const t = localStorage.getItem('pp_theme');
  if (t && t !== 'dark') document.documentElement.dataset.theme = t;
</script>
<style>
  :root { --bg:#0a0c0e; --panel:#101613; --line:#1e242a; --phos:#7ce38b; --amber:#e8b44a;
          --ink:#c7d0c9; --dim:#5c6b60; --alert:#ff5c57;
          --mono: ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--mono);
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:34px 38px; width:min(360px, 92vw); }
  .mark { color:var(--phos); font-weight:700; font-size:20px; letter-spacing:.05em; }
  .sub { color:var(--dim); font-size:12px; margin:6px 0 22px; }
  label { display:block; color:var(--dim); font-size:10px; letter-spacing:.14em; margin:14px 0 6px; }
  input { width:100%; font-family:var(--mono); font-size:14px; color:var(--ink);
          background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; }
  input:focus { outline:none; border-color:var(--phos); }
  button { width:100%; margin-top:22px; font-family:var(--mono); font-size:14px;
           background:none; color:var(--amber); border:1px solid var(--amber);
           border-radius:4px; padding:11px; cursor:pointer; }
  button:hover { background:rgba(232,180,74,.12); }
  .err { color:var(--alert); font-size:12px; margin-top:12px; min-height:16px; }

  html[data-theme="daylight"] {
    --bg:#f4f1e8; --panel:#faf8f1; --screen:#fffef9; --line:#e0dbc9;
    --phos:#177245; --amber:#986a00; --alert:#c23a32; --ink:#2b2f28; --dim:#8b8a7a;
  }
  html[data-theme="arctic"] {
    --bg:#edf1f5; --panel:#f6f9fb; --screen:#fbfdfe; --line:#d7e0e8;
    --phos:#0b7285; --amber:#b45309; --alert:#d1433f; --ink:#24313d; --dim:#7f8f9d;
  }

.lang-picker{background:#161b22;color:#8b949e;border:1px solid #272e38;border-radius:6px;
 padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
.lang-picker:focus{outline:none;border-color:#3fb950}
.lang-picker option{background:#161b22;color:#e6edf3}
</style>
</head>
<body>
<div class="card">
  <div class="mark">SmokeTrail ●</div>
  <div class="sub" data-i18n="login.title">Sign in to SmokeTrail</div>
  <label data-i18n="login.username">USERNAME</label><input id="user" autocomplete="username" autofocus>
  <label data-i18n="login.password">PASSWORD</label><input id="pass" type="password" autocomplete="current-password">
  <button id="go" data-i18n="login.signIn">Sign in</button>
  <div style="margin-top:18px;text-align:center" data-i18n-picker></div>
  <div class="err" id="err"></div>
</div>
<script>
const $ = id => document.getElementById(id);
async function login() {
  $('err').textContent = '';
  // The JSON content type is not decoration: the server requires it, because it
  // forces a CORS preflight that we never answer, which is what stops a form on
  // another site driving this endpoint. Omitting it made every login fail with a
  // 415 that this page reported as "wrong password".
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ User: $('user').value, Pass: $('pass').value })
  });
  if (res.ok) { location.href = '/'; return; }
  // Show what the server actually said. A blanket "wrong password" for every
  // failure is why the real cause took a user report to find.
  const d = await res.json().catch(() => ({}));
  $('err').textContent = d.error || `${T('login.failed')} (HTTP ${res.status})`;
}
$('go').onclick = login;
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
