<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmokeTrail — first run</title>
<style>
:root{color-scheme:dark;--bg:#0e1116;--card:#161b22;--line:#272e38;--fg:#e6edf3;--dim:#8b949e;--acc:#3fb950;--err:#f85149}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
 font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;padding:24px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
h1{margin:0 0 4px;font-size:19px;font-weight:600}
p.sub{margin:0 0 22px;color:var(--dim);font-size:13px}
label{display:block;margin:14px 0 5px;font-size:12px;color:var(--dim)}
input{width:100%;padding:9px 11px;background:#0e1116;border:1px solid var(--line);border-radius:6px;
 color:var(--fg);font:inherit}
input:focus{outline:none;border-color:var(--acc)}
button{width:100%;margin-top:20px;padding:10px;background:var(--acc);border:0;border-radius:6px;
 color:#06130a;font:600 14px inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:13px;min-height:19px}
.msg.err{color:var(--err)}
.hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}

.lang-picker{background:#161b22;color:#8b949e;border:1px solid #272e38;border-radius:6px;
 padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
.lang-picker:focus{outline:none;border-color:#3fb950}
.lang-picker option{background:#161b22;color:#e6edf3}
</style></head><body>
<form class="card" id="f">
  <h1 data-i18n="setup.title">Create the admin account</h1>
  <p class="sub" data-i18n="setup.sub">SmokeTrail has no default password. This screen appears once.</p>
  <label for="u" data-i18n="setup.username">Username</label>
  <input id="u" value="admin" autocomplete="username" required>
  <label for="p" data-i18n="setup.password">Password</label>
  <input id="p" type="password" autocomplete="new-password" required minlength="8">
  <label for="p2" data-i18n="setup.confirm">Confirm password</label>
  <input id="p2" type="password" autocomplete="new-password" required minlength="8">
  <button id="b" data-i18n="setup.create">Create account</button>
  <div class="msg" id="m"></div>
  <div class="hint" data-i18n="setup.hint">At least 8 characters.</div>
  <div style="margin-top:14px;text-align:center" data-i18n-picker></div>
</form>
<script src="/static/i18n.js"></script>
<script>
const $=i=>document.getElementById(i);
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=$('m');m.className='msg';m.textContent='';
  if($('p').value!==$('p2').value){m.className='msg err';m.textContent=T('setup.mismatch');return}
  $('b').disabled=true;$('b').textContent=T('setup.creating');
  try{
    const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({User:$('u').value,Pass:$('p').value})});
    if(r.ok){location.href='/';return}
    const j=await r.json().catch(()=>({error:'setup failed'}));
    m.className='msg err';m.textContent=j.error||'Setup failed.';
  }catch(err){m.className='msg err';m.textContent=String(err)}
  $('b').disabled=false;$('b').textContent=T('setup.create');
});
</script></body></html>
